{% extends "base.html" %}
{% block title %}Admin Login — DiskAnalysis{% endblock %}
{% block content %}
<div style="max-width:360px;margin:4rem auto;">
  <div class="card">
    <h2 style="margin-bottom:1.25rem;font-size:1.1rem;display:flex;align-items:center;gap:.5rem;"><svg class="icon" style="width:1.1rem;height:1.1rem;"><use href="#i-lock"/></svg> Admin Login</h2>
    {% if error %}
    <div class="error-banner" style="margin-bottom:1rem;">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" autofocus autocomplete="current-password" />
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
